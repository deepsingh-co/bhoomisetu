# Prometheus Configuration for BhoomiSetu Infrastructure
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bhulekh-backend-app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'

  - job_name: 'bhulekh-qdrant'
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'bhulekh-postgres'
    static_configs:
      - targets: ['postgres:5432']
