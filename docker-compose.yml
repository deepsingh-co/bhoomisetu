# ==============================================================================
# BHOOMISETU — ENTERPRISE MULTI-SERVICE DOCKER COMPOSE
# Digital India & NIC National Land Records Intelligence Architecture
# ==============================================================================

version: '3.8'

services:
  # 1. BhoomiSetu App Server (Vite + Express Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhulekh-app-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://bhulekh_admin:SecurePass123!@postgres:5432/bhulekh_cadastre?schema=public
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT=http://minio:9000
      - JWT_SECRET=NIC_BHULEKH_AI_SUPER_SECRET_KEY_SHA256_2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bhulekh-internal-net

  # 2. PostgreSQL + PostGIS (Spatial Cadastre DB)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bhulekh-postgresql-postgis
    restart: always
    environment:
      POSTGRES_USER: bhulekh_admin
      POSTGRES_PASSWORD: SecurePass123!
      POSTGRES_DB: bhulekh_cadastre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhulekh_admin -d bhulekh_cadastre"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhulekh-internal-net

  # 3. Redis (BullMQ Queues & Cache)
  redis:
    image: redis:7.2-alpine
    container_name: bhulekh-redis-bullmq
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhulekh-internal-net

  # 4. Qdrant Vector Database (Land Law RAG & Cadastre Embeddings)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: bhulekh-qdrant-vector
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - bhulekh-internal-net

  # 5. Ollama AI Local Inference (Llama 3, Gemma 2, Mistral)
  ollama:
    image: ollama/ollama:latest
    container_name: bhulekh-ollama-inference
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - bhulekh-internal-net

  # 6. MinIO S3-Compatible Object Storage (RoR PDFs, Drone Orthomosaics)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: bhulekh-minio-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - bhulekh-internal-net

  # 7. Nginx Edge Reverse Proxy & TLS Gateway
  nginx:
    image: nginx:1.27-alpine
    container_name: bhulekh-nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - bhulekh-internal-net

  # 8. Prometheus Monitoring Scraper
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: bhulekh-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - bhulekh-internal-net

  # 9. Grafana Performance & SLA Dashboards
  grafana:
    image: grafana/grafana:11.0.0
    container_name: bhulekh-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - bhulekh-internal-net

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollamadata:
  miniodata:
  promdata:
  grafanadata:

networks:
  bhulekh-internal-net:
    driver: bridge
